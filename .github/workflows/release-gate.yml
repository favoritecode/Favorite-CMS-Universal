name: Release gate
# A release is only trustworthy if (1) the signed protected-file manifest matches the sources,
# and (2) a failed Central registration can never take a site offline.
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, mbstring, pdo, pdo_sqlite, zip, curl, gd, fileinfo
      - name: PHP syntax
        run: |
          find app bootstrap.php index.php migrate.php resources public config database tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Signed protected-core manifest matches sources
        run: |
          php -r '
          $m=json_decode(file_get_contents("app/Security/core-integrity.json"),true,64,JSON_THROW_ON_ERROR);
          $files=$m["files"]; $pub=base64_decode("vLAT9ZGSIoqUt0XRndW87gY2J0vP9ew/piPKBWywo64=");
          $msg=json_encode($files,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR);
          if(!sodium_crypto_sign_verify_detached(base64_decode($m["signature"]),$msg,$pub)){fwrite(STDERR,"BAD SIGNATURE\n");exit(1);}
          $bad=0; foreach($files as $n=>$h){ if(!is_file($n)||!hash_equals($h,hash_file("sha256",$n))){fwrite(STDERR,"MISMATCH $n\n");$bad++;} }
          echo count($files)," files verified, $bad problems\n"; exit($bad?1:0);'
      - name: Central registration never takes a site offline
        run: php tests/central-pending.php
      - name: Package validation
        run: php tests/package-regression.php
