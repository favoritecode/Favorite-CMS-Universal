name: Latest stable download (Pages)

on:
  release:
    types: [published, edited, deleted, unpublished, released, prereleased]
  workflow_dispatch:
  # Reconcile releases created by GITHUB_TOKEN, which do not emit new workflow runs.
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/latest-download-pages.yml']

permissions:
  contents: read

# Serialize deployments. Every queued run resolves live API state, never its event tag.
# Do not cancel an in-flight Pages deployment and leave a detached older deployment.
concurrency:
  group: latest-download-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'favoritecode/Favorite-CMS-Universal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}download/
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test selection and build immediate redirect
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          import copy, html, json, os, re, time, unittest
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote

          REPO = os.environ['GH_REPO']
          def api(path):
              for attempt in range(4):
                  try:
                      request = Request('https://api.github.com/repos/' + REPO + path, headers={
                          'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                          'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28',
                          'User-Agent': 'Favorite-CMS-Latest-Download',
                          'Cache-Control': 'no-cache'})
                      with urlopen(request, timeout=30) as response:
                          return json.load(response)
                  except HTTPError as error:
                      if error.code == 404:
                          return None
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 3:
                          raise
                  except URLError:
                      if attempt == 3:
                          raise
                  time.sleep(2 ** attempt)

          def select(release):
              if release is None:
                  return None
              if release.get('draft') or release.get('prerelease') or not release.get('published_at'):
                  raise ValueError('The API did not return a published stable release')
              tag = release['tag_name']
              if not re.fullmatch(r'v?\d+\.\d+\.\d+', tag):
                  raise ValueError('Unsupported stable release tag: ' + tag)
              expected = 'Favorite-CMS-Universal-v' + tag.removeprefix('v') + '.zip'
              assets = [a for a in release['assets'] if a['name'] == expected and a.get('state') == 'uploaded']
              if len(assets) != 1 or assets[0].get('size', 0) <= 0:
                  raise ValueError('Expected exactly one complete official ZIP asset: ' + expected)
              asset = assets[0]
              url = 'https://github.com/' + REPO + '/releases/download/' + quote(tag, safe='') + '/' + expected
              if asset['browser_download_url'] != url:
                  raise ValueError('Unexpected download host or release path')
              return {'release_id': release['id'], 'tag': tag, 'asset_id': asset['id'],
                      'name': expected, 'url': url, 'size': asset['size'], 'digest': asset.get('digest')}

          def render_start(asset):
              if asset is None:
                  return '<!doctype html><html lang="en"><meta charset="utf-8"><title>Download unavailable</title><p>No stable release is currently published.</p><a href="https://github.com/' + REPO + '/releases">View releases</a></html>'
              url = html.escape(asset['url'], quote=True)
              js = json.dumps(asset['url']).replace('<', '\\u003c')
              return f'''<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
          <meta http-equiv="refresh" content="0;url={url}">
          <title>Downloading Favorite CMS</title>
          <script>window.location.replace({js});</script></head>
          <body><p>Your download is starting. If it does not start, <a href="{url}">download {html.escape(asset['name'])}</a>.</p></body></html>
          '''

          def render(asset):
              if asset is None:
                  return render_start(None)
              url = html.escape(asset['url'], quote=True)
              return f'''<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
          <title>Downloading Favorite CMS</title>
          <meta name="color-scheme" content="dark light">
          <style>
          :root{{color-scheme:dark;--bg:#0a1020;--panel:#111c30;--ink:#eef4ff;--muted:#a8b8d1;--line:#293950;--soft:#17253d;--blue:#447eff}}
          *{{box-sizing:border-box}}[hidden]{{display:none!important}}body{{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;font:15px/1.6 system-ui,-apple-system,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#213d6838,transparent 65%),var(--bg)}}
          main{{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 28px 90px #0003}}
          .brand{{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:750;letter-spacing:.12em;color:var(--muted)}}.brand-mark{{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--blue);color:white;font-size:18px;letter-spacing:0}}
          .download-icon{{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:#447eff1a;color:#80a7ff;margin:30px 0 20px}}svg{{width:28px;height:28px;flex-shrink:0}}
          h1{{font-size:clamp(25px,5vw,30px);letter-spacing:-.035em;line-height:1.2;margin:0 0 12px}}p{{margin:0;color:var(--muted)}}.file{{display:flex;align-items:center;gap:14px;padding:16px;margin:26px 0;background:var(--soft);border:1px solid var(--line);border-radius:14px}}.file svg{{color:#83a9ff}}.file-info{{min-width:0}}.filename{{font-size:13px;font-weight:650;overflow-wrap:anywhere}}.file-meta{{font-size:12px;color:var(--muted);margin-top:3px}}
          .actions{{display:flex;gap:10px}}.button{{display:flex;justify-content:center;align-items:center;text-align:center;min-height:46px;padding:10px 18px;border-radius:11px;text-decoration:none;font-weight:650;flex:1;color:var(--ink);border:1px solid var(--line)}}.primary{{background:var(--blue);border-color:var(--blue);color:#fff}}a:hover{{filter:brightness(1.12)}}a:focus-visible,button:focus-visible{{outline:3px solid #8db6ff;outline-offset:4px}}
          .return{{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}}.return-row{{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}}button{{font:inherit;color:#8eb3ff;border:0;background:transparent;padding:6px 0;cursor:pointer;white-space:nowrap}}progress{{display:block;width:100%;height:4px;margin-top:12px;accent-color:var(--blue);border:0;border-radius:4px;overflow:hidden}}progress::-webkit-progress-bar{{background:var(--soft)}}progress::-webkit-progress-value{{background:var(--blue)}}.footer{{margin-top:20px;font-size:11px;text-align:center;color:var(--muted)}}iframe{{display:none}}
          @media(max-width:480px){{body{{padding:16px}}main{{padding:26px 22px;border-radius:20px}}.actions{{flex-direction:column}}.return-row{{align-items:flex-start}}}}
          @media(prefers-color-scheme:light){{:root{{color-scheme:light;--bg:#f2f6fc;--panel:#fff;--ink:#182742;--muted:#5e6f88;--line:#dde5f0;--soft:#f5f8fd}}.download-icon,.file svg{{color:#386de0}}button{{color:#3267d9}}}}
          </style></head><body><main>
          <div class="brand"><span class="brand-mark" aria-hidden="true">F</span> FAVORITE CMS</div>
          <div class="download-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg></div>
          <h1>Your download is starting</h1>
          <p>The latest stable release, ready for your website.</p>
          <div class="file"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M14 2H5v20h14V7zM14 2v6h5M10 3v3m0 2v3m0 2v3m-2 1h4v3H8z"/></svg><div class="file-info"><div class="filename">{html.escape(asset['name'])}</div><div class="file-meta">{html.escape(asset['tag'])} &middot; ZIP archive &middot; Official release</div></div></div>
          <div class="actions"><a class="button primary" href="https://favoriteweb.net/">Return to website <span aria-hidden="true">&nbsp;&rarr;</span></a><a id="retry" class="button" href="{url}" target="download-frame">Download again</a></div>
          <div class="return"><div class="return-row"><p id="countdown" aria-live="polite">Returning to favoriteweb.net in 5 seconds.</p><button id="stay" type="button">Stay here</button></div><progress id="progress" max="5" value="5" aria-label="Time before returning to website"></progress></div>
          <p class="footer">Download not started? Choose &ldquo;Download again&rdquo;.</p>
          <noscript><p>Use &ldquo;Return to website&rdquo; when you are ready.</p></noscript>
          </main><iframe name="download-frame" title="File download" src="start.html"></iframe>
          <script>
          (() => {{
            const status = document.getElementById('countdown');
            const progress = document.getElementById('progress');
            const stay = document.getElementById('stay');
            let remaining = 5;
            const timer = window.setInterval(() => {{
              remaining -= 1;
              progress.value = remaining;
              if (remaining <= 0) {{
                window.clearInterval(timer);
                window.location.replace('https://favoriteweb.net/');
                return;
              }}
              status.textContent = 'Returning to favoriteweb.net in ' + remaining + (remaining === 1 ? ' second.' : ' seconds.');
            }}, 1000);
            const pause = () => {{
              window.clearInterval(timer);
              status.textContent = 'Auto-return paused. You can return whenever you are ready.';
              progress.hidden = true;
              stay.hidden = true;
            }};
            stay.addEventListener('click', pause);
            document.getElementById('retry').addEventListener('click', pause);
          }})();
          </script></body></html>
          </body></html>
          '''

          def fixture(tag='v2.0.0'):
              name = 'Favorite-CMS-Universal-v' + tag.removeprefix('v') + '.zip'
              return {'id': 1, 'tag_name': tag, 'draft': False, 'prerelease': False,
                      'published_at': '2026-11-28T00:00:00Z', 'assets': [
                      {'id': 2, 'name': name, 'state': 'uploaded', 'size': 100,
                       'browser_download_url': 'https://github.com/' + REPO + '/releases/download/' + tag + '/' + name}]}

          class SelectionTests(unittest.TestCase):
              def test_future_stable_versions(self):
                  for tag in ('v2.0.0', 'v2.0.1', 'v2.0.2', 'v3.0.0'):
                      self.assertEqual(select(fixture(tag))['tag'], tag)
              def test_draft_prerelease_unpublished_rejected(self):
                  for key, value in [('draft', True), ('prerelease', True), ('published_at', None)]:
                      release = fixture(); release[key] = value
                      with self.assertRaises(ValueError): select(release)
              def test_source_archives_and_other_assets_ignored(self):
                  release = fixture(); release['zipball_url'] = 'https://api.github.com/source.zip'
                  for name in ('Source code.zip', 'Favorite-CMS-Universal-v2.0.0-test.zip', 'Favorite-CMS-Universal-v1.2.1.zip'):
                      asset = copy.deepcopy(release['assets'][0]); asset['name'] = name
                      release['assets'].append(asset)
                  self.assertEqual(select(release)['asset_id'], 2)
              def test_missing_duplicate_incomplete_or_hostile_assets_rejected(self):
                  for mode in ('missing', 'duplicate', 'uploading', 'empty', 'hostile'):
                      release = fixture()
                      if mode == 'missing': release['assets'] = []
                      if mode == 'duplicate': release['assets'] *= 2
                      if mode == 'uploading': release['assets'][0]['state'] = 'new'
                      if mode == 'empty': release['assets'][0]['size'] = 0
                      if mode == 'hostile': release['assets'][0]['browser_download_url'] = 'https://example.com/file.zip'
                      with self.assertRaises(ValueError): select(release)
              def test_redirect_and_fallback(self):
                  asset = select(fixture()); page = render(asset); start = render_start(asset)
                  self.assertIn('window.location.replace(', start)
                  self.assertIn('content="0;url=', start)
                  self.assertIn('href="' + asset['url'] + '"', page)
                  self.assertIn('target="download-frame"', page)
              def test_download_does_not_navigate_main_page(self):
                  page = render(select(fixture()))
                  self.assertNotIn('window.location.replace("https://github.com', page)
                  self.assertNotIn('http-equiv="refresh"', page)
                  self.assertIn('name="download-frame"', page)
                  self.assertIn('src="start.html"', page)
              def test_five_second_return_and_pause_controls(self):
                  page = render(select(fixture()))
                  self.assertIn("window.location.replace('https://favoriteweb.net/')", page)
                  self.assertIn('let remaining = 5;', page)
                  self.assertIn('id="stay"', page)
                  self.assertIn("getElementById('retry').addEventListener('click', pause)", page)
              def test_no_stable_release_removes_stale_redirect(self):
                  self.assertIsNone(select(None))
                  self.assertNotIn('window.location.replace', render(None))

          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromTestCase(SelectionTests))
          if not result.wasSuccessful(): raise SystemExit(1)
          # Detect an asset edit/replacement while resolving the current release.
          for attempt in range(4):
              selected = select(api('/releases/latest'))
              if selected == select(api('/releases/latest')): break
          else: raise RuntimeError('Release changed repeatedly; retry deployment')
          output = Path('_site/download'); output.mkdir(parents=True)
          (output / 'index.html').write_text(render(selected), encoding='utf-8')
          (output / 'start.html').write_text(render_start(selected), encoding='utf-8')
          (output / 'release.json').write_text(json.dumps(selected, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(selected, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Latest stable download\n\n8 selection/rendering tests passed. Download frame starts the ZIP; the main page returns to favoriteweb.net after 5 seconds unless paused.\n\n```json\n' + json.dumps(selected, indent=2) + '\n```\n')
      - name: Upload static redirect only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
